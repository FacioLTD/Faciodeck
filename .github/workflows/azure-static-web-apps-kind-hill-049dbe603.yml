name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          echo "Verifying build output..."
          ls -la out/
        env:
          CI: true

      # The published PDF is a deployment artifact, deliberately not committed
      # to this public repository. Preserve it during a code-only deployment.
      - name: Preserve published PDF
        run: |
          if [ ! -s out/Facio-Investor-Deck.pdf ]; then
            curl --fail --silent --show-error --location --retry 3 \
              --max-time 60 --proto '=https' --proto-redir '=https' \
              https://deck.facio.io/Facio-Investor-Deck.pdf \
              --output out/Facio-Investor-Deck.pdf
          fi
          test "$(head -c 5 out/Facio-Investor-Deck.pdf)" = '%PDF-'

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_HILL_049DBE603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "out" # Deploy the prebuilt static export
          api_location: "" # Api source code path - optional
          output_location: "" # app_location already points at the artifact
          skip_app_build: true # We just built it manually above
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_HILL_049DBE603 }}
          action: "close"
